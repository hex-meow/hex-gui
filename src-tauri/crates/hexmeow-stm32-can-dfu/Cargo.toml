[package]
name = "hexmeow-stm32-can-dfu"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Reusable, fail-closed STM32 DFU-over-CANopen core for hexmeow devices."
license = "MIT OR Apache-2.0"

[features]
default = ["can-bus"]
can-bus = ["dep:can-transport", "dep:canopen-sdo"]

[dependencies]
async-trait = "0.1"
image-container = { path = "../image-container", version = "0.1.0", features = ["std"] }
mcu-series = { path = "../mcu-series", version = "0.1.0", features = ["std"] }
od-consts = { path = "../od-consts", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["time"] }

canopen-sdo = { version = "0.1.1", default-features = false, features = ["tokio"], optional = true }
can-transport = { version = "0.1.2", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
