[package]
name = "motor-img-release"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Signed release bindings for supplier Motor IMG artifacts"
license = "MIT OR Apache-2.0"

[dependencies]
hex = "0.4"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
