[package]
name = "hex-motor-gui"
version = "1.3.1"
edition = "2021"
description = "Desktop service GUI for hexmeow motors, robots, and firmware."
license = "MIT OR Apache-2.0"

[lib]
name = "hex_motor_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [
    "crates/cobs-can-iap",
    "crates/hexmeow-stm32-can-dfu",
    "crates/hpm-usb-dfu",
    "crates/image-container",
    "crates/mcu-series",
    "crates/od-consts",
]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"
protoc-bin-vendored = "3"   # 自带 protoc,免系统安装

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# analyzer.rs 的 TxMirror 要给 can-transport 的 #[async_trait] trait 写 impl。
async-trait = "0.1"
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
hex = "0.4"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
getrandom = "0.3"
chrono = "0.4"
# Published Meow Motor driver and host services.
hex-motor = "0.3.0"

# Public, secret-free runtime for the current HPM USB Bootloader. It owns the
# strict legacy profile/package parser and flash state machine; the Tauri
# module is only an IPC adapter.
hpm-usb-dfu = { path = "crates/hpm-usb-dfu" }
hexmeow-stm32-can-dfu = { path = "crates/hexmeow-stm32-can-dfu" }
cobs-can-iap = { path = "crates/cobs-can-iap" }

# CAN Analyzer 的 SDO tab:纯 SDO 客户端(读/写对象字典),与 comeow CLI 同一引擎,
# 跑在分析仪已持有的 Arc<dyn CanBus> 上。值编解码逻辑移植自 comeow(见 sdo_client.rs)。
canopen-sdo = { version = "0.1.1", default-features = false, features = ["tokio"] }

# Base(Zenoh):连 hex-controller 暴露的 robot_api。
zenoh = { version = "1", default-features = false, features = ["transport_tcp", "transport_udp"] }
prost = "0.13"
# 机械臂动力学(重力 G(q)):host 端 tau_ff 前馈,与控制器 GRAVITY_COMP 共用同一 crate(仅依赖 urdf-rs)。
# crates.io 版(CI 需要)。本地开发未发布改动时可临时改回 { path = "../../hex-arm-dynamics" }。
hex-arm-dynamics = "0.1.1"

# The `gs_usb` backend (candleLight over USB, CAN-FD) is cross-platform, so
# it's enabled on every target. On Linux we additionally build `socketcan`.
# Adding another backend is a single arm in src/backend.rs; the rest of the
# GUI keeps holding an `Arc<dyn CanBus>` and never knows the difference.
[target.'cfg(target_os = "linux")'.dependencies]
can-transport = { version = "0.1.3", features = ["socketcan", "gs_usb"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
can-transport = { version = "0.1.3", features = ["gs_usb"] }
