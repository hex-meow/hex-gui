# Cross-platform build & release for the Tauri app.
#
#   • push to main / PRs    → build all platforms, upload artifacts to the run
#   • push a tag `v*`       → build all platforms, create a DRAFT GitHub Release
#                             with every bundle attached
#   • manual (Run workflow) → build all platforms, upload artifacts
#
# Bundles produced per platform (bundle.targets = "all" in tauri.conf.json):
#   • Linux (ubuntu-22.04) → .deb + .AppImage   (x86-64)
#   • Windows (windows-latest) → .msi + .exe NSIS installer  (x86-64)
#   • macOS (macos-latest) → .dmg + .app, built `universal` (Intel + Apple Silicon)
#
# ⚠️ PREREQUISITES for a green CI build — two things must resolve in a FRESH
# checkout (hex-motor / can-transport / canopen-sdo are already crates.io deps):
#   1. hex-arm-dynamics — publish it to crates.io. Cargo.toml now uses
#      `hex-arm-dynamics = "0.1.0"` (no longer a path dep).
#   2. The shared proto — build.rs compiles `../../hex-robot-proto/proto` by
#      default. CI checks out hex-robot-proto/master into `_proto` and points
#      ROBOT_PROTO_DIR at it.
#
# ⚠️ Bundles here are UNSIGNED. macOS users hit Gatekeeper (right-click → Open);
# Windows users hit SmartScreen. Add code signing later via tauri-action env.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed for the tag-triggered GitHub Release.
permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.read.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Read and validate the single application version
        id: read
        shell: bash
        run: |
          app_version="$(
            cargo metadata \
              --manifest-path src-tauri/Cargo.toml \
              --format-version 1 \
              --no-deps \
              --locked |
            jq -r '.packages[] |
              select(.name == "hex-motor-gui") |
              .version'
          )"

          test -n "$app_version"
          test "$app_version" != "null"
          jq -e 'has("version") | not' package.json >/dev/null
          jq -e \
            '(has("version") | not) and
             (.packages[""] | has("version") | not)' \
            package-lock.json >/dev/null
          jq -e 'has("version") | not' \
            src-tauri/tauri.conf.json >/dev/null

          if [[ "$GITHUB_REF_TYPE" == "tag" ]] &&
             [[ "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "tag $GITHUB_REF_NAME != v$app_version" >&2
            exit 1
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out shared proto (hex-robot-proto)
        uses: actions/checkout@v4
        with:
          repository: hex-meow/hex-robot-proto
          ref: master
          path: _proto
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential pkg-config libssl-dev \
            libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
        env:
          ROBOT_PROTO_DIR: ../_proto/proto

  build:
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon runner; builds a universal binary
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04 # oldest target → forward-compatible glibc / WebKitGTK
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Shared proto contract lives in a sibling repo. CI consumes only the
      # verified contract on master; build.rs compiles it via ROBOT_PROTO_DIR.
      - name: Check out shared proto (hex-robot-proto)
        uses: actions/checkout@v4
        with:
          repository: hex-meow/hex-robot-proto
          ref: master
          path: _proto
      - name: Verify shared proto inputs
        shell: bash
        run: |
          for file in common controller robot base arm ee lift events; do
            test -f "_proto/proto/$file.proto" || {
              echo "Missing shared proto: $file.proto" >&2
              exit 1
            }
          done
      - name: Point the build at the shared proto
        shell: bash # forward-slash relative path → works on Linux/macOS/Windows
        run: echo "ROBOT_PROTO_DIR=../_proto/proto" >> "$GITHUB_ENV"

      # Tauri v2 Linux runtime/build deps: WebKitGTK 4.1, GTK3, libsoup3, etc.
      # libfuse2 lets the AppImage tooling run. (gs_usb uses pure-Rust nusb, so
      # no libusb/libudev needed.)
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential pkg-config libssl-dev \
            libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action runs `npm run build` (beforeBuildCommand) + `tauri build`,
      # using the local @tauri-apps/cli devDependency. On a tag it creates (or
      # appends to) the GitHub Release and uploads this platform's bundles.
      - name: Build Tauri bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "hex-motor-gui v${{ needs.version.outputs.app_version }}"
          releaseDraft: true
          releaseBody: |
            Unsigned builds for Linux / Windows / macOS.

            - **Linux** — `.deb` (`sudo apt install ./hex-motor-gui_*.deb`) or `.AppImage` (`chmod +x` then run).
            - **Windows** — `.msi` or the NSIS `.exe` installer.
            - **macOS** — `.dmg` (universal, Intel + Apple Silicon). Unsigned: right-click → Open the first time to get past Gatekeeper.

      # For non-tag runs there is no Release, so attach the bundles to the run.
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: hex-motor-gui-v${{ needs.version.outputs.app_version }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
          if-no-files-found: warn
